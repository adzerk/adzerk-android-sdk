plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

def versionMajor = 2
def versionMinor = 3
def versionPatch = 2
def versionBuild = 0

group = 'com.adzerk'
version =  "${versionMajor}.${versionMinor}.${versionPatch}"

android {
    namespace 'com.adzerk.android.sdk'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 22
        targetSdk 35
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        buildConfigField "String", "VERSION_NAME", "\"${versionMajor}.${versionMinor}.${versionPatch}\""
        buildConfigField "String", "LIBRARY_PACKAGE_NAME", "\"com.adzerk.android.sdk\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "passed", "skipped", "failed"
        minGranularity 2
        maxGranularity 3
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.adzerk'
            artifactId = 'com.adzerk.android.sdk'
            version = version

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'Adzerk Android Decision SDK'
                packaging = 'aar'
                description = 'Adzerk Android Decision SDK'
                url = 'https://github.com/adzerk/adzerk-android-sdk'

                scm {
                    connection = 'scm:git:git://github.com/adzerk/adzerk-android-sdk.git'
                    developerConnection = 'scm:git:ssh://github.com/adzerk/adzerk-android-sdk.git'
                    url = 'https://github.com/adzerk/adzerk-android-sdk'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'kevel'
                        name = 'Kevel'
                        email = 'engineering@kevel.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = "ossrh-staging-api"
            def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = findProperty("nexusUsername") ?: ""
                password = findProperty("nexusPassword") ?: ""
            }
        }
    }
}

signing {
    sign publishing.publications.release
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

task findConventions {
    doLast {
        println project.getConvention()
    }
}
